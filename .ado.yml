trigger:
  - main

pr:
  - main

jobs:
  - job: Changes
    displayName: 'Detect Changed Components'
    pool:
      vmImage: 'ubuntu-latest'
      name: Azure Pipelines

    steps:
    - checkout: self
      fetchDepth: 2
    - task: Bash@3
      name: classify
      displayName: 'Select CI Jobs'
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          changes=$(mktemp)
          trap 'rm -f -- "$changes"' EXIT
          # PR checkout is a merge commit; its first parent is the target branch.
          git diff --no-renames --name-only -z HEAD^ HEAD > "$changes"
          perfcollect=false
          perfview=false
          while IFS= read -r -d '' path; do
            printf 'Changed: %q\n' "$path"
            case "$path" in
              src/perfcollect/*|.pipelines/perfcollect-job.yml) perfcollect=true ;;
              # Shared scheduling and Git metadata do not identify an application change.
              .ado.yml|.gitattributes|.gitignore) ;;
              *) perfview=true ;;
            esac
          done < "$changes"
          if [[ "$perfcollect" == false && "$perfview" == false ]]; then
            perfview=true
          fi
          echo "##vso[task.setvariable variable=perfcollect;isOutput=true]$perfcollect"
          echo "##vso[task.setvariable variable=perfview;isOutput=true]$perfview"

  - job: PerfView_Debug
    dependsOn: Changes
    condition: and(succeeded(), eq(dependencies.Changes.outputs['classify.perfview'], 'true'))
    pool:
      vmImage: 'windows-2025-vs2026'
      name: Azure Pipelines

    steps:
    - template: /.pipelines/perfview-job.yml
      parameters:
        flavor: 'Debug'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifacts'
      inputs:
        targetPath: '$(build.artifactstagingdirectory)'
        artifact: 'PerfViewBinaries-Debug'
        parallel: true
      condition: succeededOrFailed()

  - job: PerfView_Release
    dependsOn: Changes
    condition: and(succeeded(), eq(dependencies.Changes.outputs['classify.perfview'], 'true'))
    pool:
      vmImage: 'windows-2025-vs2026'
      name: Azure Pipelines

    steps:
    - template: /.pipelines/perfview-job.yml
      parameters:
        flavor: 'Release'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact'
      inputs:
        targetPath: '$(build.artifactstagingdirectory)'
        artifact: 'PerfViewBinaries-Release'
        parallel: true

  - job: PerfCollect
    dependsOn: Changes
    condition: and(succeeded(), eq(dependencies.Changes.outputs['classify.perfcollect'], 'true'))
    strategy:
      matrix:
        Mariner:
          target: 'mariner-2.0'
          baseImage: 'mcr.microsoft.com/cbl-mariner/base/core:2.0@sha256:c833841d2dcfd3081d2ee807050d19368854f70d9b6faef027463e2c6f45ee41'
        Debian:
          target: 'ci-debian12'
          baseImage: 'mcr.microsoft.com/dotnet/sdk:8.0-bookworm-slim@sha256:ec9c0a0dc5f60adc2065762050638dd5ed5facfc53716d4580a42d86027c8e80'
        Alpine:
          target: 'alpine'
          baseImage: 'mcr.microsoft.com/dotnet/sdk:8.0-alpine@sha256:3111b113abec80b4a8a3d4b5cebebf61a4cdab019b7e56ca3e6389e6ac4e1c8d'
        AzureLinux:
          target: 'azurelinux-3.0'
          baseImage: 'mcr.microsoft.com/azurelinux/base/core:3.0@sha256:bfd3e44899fe7c17f6fda42a6ef2a322f2178c2dafb88e69fd87675cdcac39ec'
    pool:
      vmImage: 'ubuntu-latest'
      name: Azure Pipelines

    steps:
    - template: /.pipelines/perfcollect-job.yml
