steps:
- task: Bash@3
  displayName: 'Get Docker Version'
  inputs:
    targetType: inline
    script: 'docker --version'

- task: Bash@3
  displayName: 'Run Tests in Containers'
  inputs:
    targetType: inline
    script: 'bash ./run-container.sh "$BASE_IMAGE" "$TARGET" "$RESULTS_DIR"'
    workingDirectory: src/perfcollect/tests
  env:
    BASE_IMAGE: $(baseImage)
    TARGET: $(target)
    RESULTS_DIR: $(Build.ArtifactStagingDirectory)/perfcollect

- task: PublishPipelineArtifact@1
  displayName: 'Publish Perfcollect Results'
  condition: always()
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/perfcollect'
    artifact: 'perfcollect-$(target)'