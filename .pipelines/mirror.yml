trigger:
  - main

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      codeql:
        compiled:
          enabled: false
          justificationForDisabling: 'This is a mirror pipeline that does not build any code.'
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Windows2022
      os: windows

    stages:
    - stage: Mirror
      jobs:
        - job: Mirror
          steps:
          - task: AzureCLI@2
            displayName: 'Mint AzDO token via WIF'
            inputs:
              azureSubscription: 'DncEng Insertion: Roslyn and Razor'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
                if ($LASTEXITCODE -ne 0) { Write-Error "Failed to get access token"; exit 1 }
                $token = $token.Trim()
                if ([string]::IsNullOrWhiteSpace($token)) { Write-Error "Token is empty"; exit 1 }
                Write-Host "##vso[task.setvariable variable=AzdoToken;issecret=true]$token"

          - task: PowerShell@1
            displayName: 'Set SourceBranch Variable'
            inputs:
              scriptType: inlineScript
              arguments: '$(Build.SourceBranch)'
              inlineScript: |
                param(
                  [string]$SourceBranch
                )
                if ($SourceBranch.StartsWith("refs/heads/"))
                {
                    # strip off the refs/heads/ prefix
                    $SourceBranch=$SourceBranch.Substring(11)
                }
                $env:SourceBranch=$SourceBranch
                Write-Host ("##vso[task.setvariable variable=SourceBranch;]$env:SourceBranch")

          - task: PowerShell@1
            displayName: 'Set MirrorBranch Variable'
            inputs:
              scriptType: inlineScript
              inlineScript: |
                $env:MirrorBranch='mirror/'+[Guid]::NewGuid().ToString()
                Write-Host ("##vso[task.setvariable variable=MirrorBranch;]$env:MirrorBranch")

          - task: PipAuthenticate@1
            displayName: 'Pip Authenticate'
            inputs:
              artifactFeeds: 'DevDiv/PerfView-Mirror'

          - task: UsePythonVersion@0
            displayName: 'Use Python 3.11'
            inputs:
              versionSpec: '3.11'

          - task: CmdLine@2
            displayName: 'Update pip to latest'
            inputs:
              script: 'python -m pip install --upgrade pip'

          - task: CmdLine@2
            displayName: 'Install Azure CLI'
            inputs:
              script: 'pip install --pre azure-cli'

          - task: CmdLine@2
            displayName: 'Install Azure DevOps Extension'
            inputs:
              script: 'az extension add -n azure-devops'

          - task: CmdLine@2
            displayName: 'Configure Git user.email'
            inputs:
              script: 'git config user.email "dn-bot@microsoft.com"'

          - task: CmdLine@2
            displayName: 'Configure git user.name'
            inputs:
              script: 'git config user.name "dotnet-bot"'

          - task: CmdLine@2
            displayName: 'Checkout GitHub main Branch'
            inputs:
              script: 'git checkout $(SourceBranch)'

          - task: PowerShell@1
            displayName: 'Record GitHub Commit'
            inputs:
              scriptType: inlineScript
              inlineScript: |
                $githubCommit = (git rev-parse HEAD).Trim()
                if ($LASTEXITCODE -ne 0 -or $githubCommit -notmatch '^[0-9a-f]{40}$')
                {
                  Write-Error "Failed to resolve the GitHub commit."
                  exit 1
                }

                Write-Host "##vso[task.setvariable variable=GitHubCommit;]$githubCommit"

          - task: CmdLine@2
            displayName: 'Create Mirror Branch'
            inputs:
              script: 'git checkout -b $(MirrorBranch)'

          - task: CmdLine@2
            displayName: 'Run git reset'
            inputs:
              script: 'git reset --hard origin/$(SourceBranch)'
            enabled: false

          - task: CmdLine@2
            displayName: 'Pull AzDO SourceBranch'
            inputs:
              script: 'git pull --strategy=recursive --strategy-option no-renames https://x-access-token:$(AzdoToken)@devdiv.visualstudio.com/DevDiv/_git/perfView $(SourceBranch)'

          - task: PowerShell@1
            displayName: 'Record GitHub Commit Metadata'
            inputs:
              scriptType: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $existingCommit = @(
                  Get-Content internal/.github-last-mirrored-commit -ErrorAction SilentlyContinue |
                    Where-Object { $_ -and -not $_.TrimStart().StartsWith('#') }
                )
                if ($existingCommit.Count -eq 1)
                {
                  git merge-base --is-ancestor $existingCommit[0] $(GitHubCommit)
                  if ($LASTEXITCODE -eq 1)
                  {
                    Write-Error "The previously mirrored GitHub commit is not an ancestor of the commit being mirrored. This may indicate that mirror runs completed out of order or that GitHub history was rewritten; refusing to replace the recorded commit."
                    exit 1
                  }
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                }
                elseif ($existingCommit.Count -gt 1)
                {
                  Write-Error "The mirrored GitHub commit metadata contains multiple commit values."
                  exit 1
                }

                $metadata = @(
                  '# This file is updated by .pipelines/mirror.yml when GitHub main is mirrored to Azure DevOps.'
                  '# Do not update this file manually.'
                  '$(GitHubCommit)'
                )
                Set-Content -Path internal/.github-last-mirrored-commit -Value $metadata -Encoding Ascii
                git add internal/.github-last-mirrored-commit
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                git diff --cached --quiet
                if ($LASTEXITCODE -eq 1)
                {
                  git commit -m "Update mirrored GitHub commit"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                }
                elseif ($LASTEXITCODE -ne 0)
                {
                  exit $LASTEXITCODE
                }

          - task: CmdLine@2
            displayName: 'Run git push'
            inputs:
              script: 'git push https://x-access-token:$(AzdoToken)@devdiv.visualstudio.com/DevDiv/_git/perfView $(MirrorBranch)'

          - task: PowerShell@1
            displayName: 'Create Pull Request'
            inputs:
              scriptType: inlineScript
              arguments: '$(AzdoToken)'
              inlineScript: |
                param(
                  [string]$AccessToken
                )
                $env:AZURE_DEVOPS_EXT_PAT=$AccessToken
                $Organization="https://devdiv.visualstudio.com"
                $Project="DevDiv"
                $Repository="PerfView"
                az devops configure --defaults organization=$Organization project=$Project
                az repos pr create --repository $Repository --auto-complete true --delete-source-branch true --title "Mirror Changes from GitHub" --source-branch $(MirrorBranch) --target-branch $(SourceBranch)